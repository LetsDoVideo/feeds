name: Build and Release
permissions:
  actions: read
  contents: write
  security-events: write
  id-token: write
on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
jobs:
  build:
    name: Build Feeds
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          install-deps: 'true'
      - name: Configure and Build
        shell: cmd
        env:
          FEEDS_ZOOM_CLIENT_ID: ${{ secrets.FEEDS_ZOOM_CLIENT_ID }}
        run: |
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DFEEDS_ZOOM_CLIENT_ID="%FEEDS_ZOOM_CLIENT_ID%" -DFEEDS_BUILD_TESTS=ON
          cmake --build build --config Release
      - name: Run Tests
        shell: pwsh
        run: |
          # Run the standalone parsing/IPC tests (e2p_reader) before signing and
          # packaging, so a broken >4KB E2P reader or roster parse gates the
          # release build instead of shipping. This job configures with a raw
          # cmake call (no preset), so -DFEEDS_BUILD_TESTS=ON above is what builds
          # the target; ctest runs it out of the same build/ tree.
          ctest --test-dir build --build-config Release --output-on-failure
          if ( $LASTEXITCODE -ne 0 ) { throw "ctest failed with exit code $LASTEXITCODE" }
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Plugin
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: feeds-signing
          certificate-profile-name: feeds-signing
          files-folder: ${{ github.workspace }}\build\Release
          files-folder-filter: dll,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Assemble Drop-in ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/obs-plugins/64bit"
          Copy-Item "build/Release/feeds.dll" -Destination "dist/obs-plugins/64bit/"
          Copy-Item "build/Release/feeds.pdb" -Destination "dist/obs-plugins/64bit/"
          # Copy the whole data/ tree wholesale so new assets (e.g. the
          # Connect-chooser icons under data/icons/) ship automatically rather
          # than each needing its own enumerated copy line here.
          New-Item -ItemType Directory -Force -Path "dist/data/obs-plugins/feeds"
          Copy-Item "data/*" -Destination "dist/data/obs-plugins/feeds/" -Recurse
          New-Item -ItemType Directory -Force -Path "dist/bin/64bit/zoom-sdk"
          Get-ChildItem "zoom-sdk/bin" -File | Copy-Item -Destination "dist/bin/64bit/zoom-sdk/"
          New-Item -ItemType Directory -Force -Path "dist/bin/64bit/zoom-sdk/language"
          Copy-Item "zoom-sdk/bin/language/*" -Destination "dist/bin/64bit/zoom-sdk/language/"
          New-Item -ItemType Directory -Force -Path "dist/bin/64bit/zoom-sdk/ringtone"
          Copy-Item "zoom-sdk/bin/ringtone/*" -Destination "dist/bin/64bit/zoom-sdk/ringtone/"
          Copy-Item "build/Release/FeedsEngine.exe" -Destination "dist/bin/64bit/zoom-sdk/"
      
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "Feeds-${{ github.ref_name }}-windows-x64.zip"
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build Installer
        shell: cmd
        run: |
          copy LICENSE installer\LICENSE
          "C:\Program Files (x86)\NSIS\makensis.exe" /DROOT_DIR="%CD%" installer\feeds-installer.nsi
          move installer\Feeds-Setup.exe Feeds-${{ github.ref_name }}-Setup.exe
      - name: Sign Installer
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: feeds-signing
          certificate-profile-name: feeds-signing
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256 
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Feeds-${{ github.ref_name }}
          path: |
            Feeds-*-windows-x64.zip
            Feeds-*-Setup.exe

  # macOS build: the plugin plus FeedsEngine.app (the Zoom Meeting SDK host),
  # built through the OBS plugin template's own macOS scripts
  # (.github/scripts/build-macos / package-macos, the macos-ci preset) into an
  # installable .pkg, signed with our Developer ID and notarized (credentials
  # are secrets of the "release" environment). A build that cannot sign or
  # notarize fails rather than uploading a package Gatekeeper would block.
  # Deliberately independent of the Windows job:
  # nothing needs it, so a macOS failure never blocks the Windows build or a
  # release, and releases still ship Windows assets only.
  #
  # The engine needs the licensed macOS Zoom SDK, which is NOT in this repo (it
  # is ~600 MB and not ours to redistribute). It is fetched below from a DRAFT
  # release asset; when that asset is absent the job still builds and packages
  # the plugin, just without an engine.
  macos-build:
    name: Build Feeds (macOS)
    runs-on: macos-14
    environment: release
    env:
      FEEDS_ZOOM_CLIENT_ID: ${{ secrets.FEEDS_ZOOM_CLIENT_ID }}
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set Up Environment
        id: setup
        run: |
          # OBS 31's plugin CMake requires Xcode 16 and the macOS 15 SDK
          # (cmake/macos/compilerconfig.cmake). The macos-14 image ships Xcode 16
          # alongside an older default, so select the newest Xcode 16 present.
          local -a xcodes=(/Applications/Xcode_16*.app(N))
          if (( ! ${#xcodes} )) {
            print "::error::No Xcode 16 found on this runner"
            exit 1
          }
          local xcode=${${(nO)xcodes}[1]}
          print "Selecting ${xcode}"
          sudo xcode-select --switch "${xcode}/Contents/Developer"
          xcodebuild -version

          local product_name product_version
          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"
          print "pluginName=${product_name}" >> $GITHUB_OUTPUT
          print "pluginVersion=${product_version}" >> $GITHUB_OUTPUT
      # Imports the Developer ID Application + Installer certificates (one .p12)
      # into a temporary keychain and decodes the App Store Connect API key used
      # by notarytool. Secrets come from the "release" environment this job runs
      # in, not from repository secrets.
      - name: Set Up Codesigning
        id: codesign
        uses: ./.github/actions/setup-macos-codesigning
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_IDENTITY_APP }}
          installerIdentity: ${{ secrets.MACOS_SIGNING_IDENTITY_INSTALLER }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          notarizationKey: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          notarizationKeyId: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notarizationIssuer: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      # The setup action treats missing credentials as "build unsigned". Here
      # that would silently ship an artifact Gatekeeper blocks, so stop instead.
      - name: Require Signing Credentials
        run: |
          if [[ '${{ steps.codesign.outputs.haveCodesignIdent }}' != true ]] {
            print "::error::Developer ID signing credentials missing (MACOS_SIGNING_* secrets in the release environment)"
            exit 1
          }
          if [[ '${{ steps.codesign.outputs.haveNotarizationKey }}' != true ]] {
            print "::error::Notarization API key missing (MACOS_NOTARY_* secrets in the release environment)"
            exit 1
          }
          print "Signing as team ${{ steps.codesign.outputs.codesignTeam }}"
      # The macOS Zoom Meeting SDK is licensed and ~600 MB, so it is kept as an
      # asset on a DRAFT release ("SDK assets — DO NOT PUBLISH"): invisible to
      # the public, downloadable by this workflow's own token. Never commit it
      # and never publish that release.
      #
      # A missing asset is NOT an error: the plugin still builds and loads, and
      # the CMake warning plus the engine-client log line say why Zoom features
      # are unavailable. That keeps macOS CI green before the SDK is uploaded.
      # NEVER fetch by tag or by a browser_download_url. A draft release has no
      # finalized tag: the URL carries a throwaway "untagged-<hash>" that changes
      # whenever the draft is edited, so anything built on it breaks silently
      # later. The release is found through the API instead — by its NAME, with
      # the asset's filename as the fallback — and the asset is downloaded by its
      # numeric id, which is stable.
      - name: Fetch the macOS Zoom SDK (private draft-release asset)
        id: zoom_sdk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_name="zoom-sdk-macos-7.1.5.84750.zip"
          release_name="SDK assets"   # substring of "SDK assets — DO NOT PUBLISH"

          # Drafts are only listed for a token with write access; the job's
          # permissions provide that. Match the release by name first so the
          # intended draft wins even if another draft ever carries a copy.
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate)"
          asset_id="$(printf '%s' "${releases}" | jq -r --arg name "${release_name}" --arg asset "${asset_name}" \
              '[.[] | select(.draft) | select((.name // "") | contains($name)) | .assets[] | select(.name == $asset) | .id] | first // empty')"
          matched_by="name"
          if [ -z "${asset_id}" ]; then
              asset_id="$(printf '%s' "${releases}" | jq -r --arg asset "${asset_name}" \
                  '[.[] | select(.draft) | .assets[] | select(.name == $asset) | .id] | first // empty')"
              matched_by="asset filename"
          fi

          if [ -z "${asset_id}" ]; then
              echo "::warning::${asset_name} not found on any draft release; building the plugin WITHOUT the engine."
              printf '%s' "${releases}" | jq -r '.[] | select(.draft) | "draft release: name=\(.name // "(none)") assets=[\([.assets[].name] | join(", "))]"' || true
              exit 0
          fi
          echo "Found the SDK asset by ${matched_by} (asset id ${asset_id})"
          gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "${RUNNER_TEMP}/zoom-sdk.zip"
          mkdir -p "${RUNNER_TEMP}/zoom-sdk-extracted"
          unzip -q "${RUNNER_TEMP}/zoom-sdk.zip" -d "${RUNNER_TEMP}/zoom-sdk-extracted"
          # The archive holds <root>/ZoomSDK/ZoomSDK.framework plus the sibling
          # frameworks and bundles the SDK loads at auth time. The engine needs
          # that whole directory, not just the framework.
          sdk_dir="$(find "${RUNNER_TEMP}/zoom-sdk-extracted" -maxdepth 3 -type d -name ZoomSDK \
              -exec test -d '{}/ZoomSDK.framework' ';' -print | head -1)"
          if [ -z "${sdk_dir}" ]; then
              echo "::error::No ZoomSDK/ZoomSDK.framework inside ${asset_name}"
              find "${RUNNER_TEMP}/zoom-sdk-extracted" -maxdepth 3 -type d | head -20
              exit 1
          fi
          echo "FEEDS_MAC_ZOOM_SDK_DIR=${sdk_dir}" >> "$GITHUB_ENV"
          echo "Zoom macOS SDK ready at ${sdk_dir}"
      - name: Build Plugin
        uses: ./.github/actions/build-plugin
        with:
          target: macos-arm64
          config: RelWithDebInfo
          codesign: 'true'
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
      - name: Package Plugin
        uses: ./.github/actions/package-plugin
        with:
          target: macos-arm64
          config: RelWithDebInfo
          package: 'true'
          codesign: 'true'
          notarize: 'true'
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          installerIdent: ${{ steps.codesign.outputs.installerIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          notaryKeyPath: ${{ steps.codesign.outputs.notarizationKeyPath }}
          notaryKeyId: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notaryIssuer: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      # Independent check of what is about to be uploaded. package-macos already
      # fails on a rejected notarization; this re-verifies the result from the
      # outside (signatures, entitlements, Gatekeeper, stapled ticket), so a
      # signing or notarization gap fails here instead of reaching a tester.
      - name: Verify Signing and Notarization
        run: |
          local -r team='${{ steps.codesign.outputs.codesignTeam }}'
          local -r name='${{ steps.setup.outputs.pluginName }}'
          local -r pkg="release/${name}-${{ steps.setup.outputs.pluginVersion }}-macos-arm64.pkg"
          local -r plugin="release/RelWithDebInfo/${name}.plugin"
          local -r engine="${plugin}/Contents/MacOS/FeedsEngine.app"

          fail() { print "::error::${1}"; exit 1 }

          # Signed by our team, secure timestamp, hardened runtime.
          check_signature() {
            local info
            info="$(codesign --display --verbose=2 "${1}" 2>&1)"
            print -r -- "${info}"
            [[ ${info} == *"TeamIdentifier=${team}"* ]] || fail "${1}: not signed by team ${team}"
            [[ ${info} == *"Timestamp="* ]] || fail "${1}: no secure timestamp"
            [[ ${info} == *"flags="*"(runtime)"* ]] || fail "${1}: hardened runtime not enabled"
          }

          print '::group::Plugin bundle'
          codesign --verify --deep --strict --verbose=2 "${plugin}"
          check_signature "${plugin}"
          print '::endgroup::'

          if [[ -d ${engine} ]] {
            print '::group::FeedsEngine.app'
            codesign --verify --deep --strict --verbose=2 "${engine}"
            check_signature "${engine}"
            # The engine must keep its library-validation exception under the
            # hardened runtime, or it cannot load the Zoom SDK at all.
            local ents
            ents="$(codesign --display --entitlements - --xml "${engine}" 2>/dev/null)"
            [[ ${ents} == *com.apple.security.cs.disable-library-validation* ]] \
              || fail "FeedsEngine.app lost its disable-library-validation entitlement"
            spctl --assess --type execute --verbose=4 "${engine}"
            print '::endgroup::'
          } else {
            print "::warning::No FeedsEngine.app in the plugin (SDK asset missing?); verified the plugin only"
          }

          print '::group::Installer package'
          pkgutil --check-signature "${pkg}"
          spctl --assess --type install --verbose=4 "${pkg}"
          xcrun stapler validate "${pkg}"
          print '::endgroup::'
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Feeds-${{ github.ref_name }}-macos
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-arm64*.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Feeds-${{ github.ref_name }}
      # Create the release as a DRAFT with the installer attached. A draft is
      # excluded from /releases/latest, which is what the in-app update check
      # polls — so users are never notified of a release before its installer is
      # downloadable. softprops creates the release (as draft) and uploads the
      # assets to it; nothing is published yet.
      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            Feeds-*-windows-x64.zip
            Feeds-*-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Flip the draft to published only AFTER the installer is attached above.
      # This is the moment /releases/latest starts returning it — so it never
      # surfaces a published release whose download doesn't exist yet.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
